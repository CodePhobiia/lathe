# Semgrep configuration for Lathe (SEC-5).
#
# This file is reserved for future custom local rules.
#
# The CI gate and local reproduction command invoke the Semgrep Registry
# packs explicitly with repeated `--config p/...` flags. Keeping that list in
# the command avoids relying on unsupported Registry pack expansion from this
# YAML file.
#
# Usage (local):
#   semgrep --error --config p/python --config p/security-audit --config p/owasp-top-ten lathe/
#   semgrep --validate --config .semgrep.yml
#
# To silence a false positive at a call site, annotate the offending line:
#   result = dangerous_call()  # nosemgrep: rule-id-here
#
# The CI workflow uses the same explicit Registry pack list.

rules: []
