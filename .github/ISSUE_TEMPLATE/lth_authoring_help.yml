name: .lth authoring help
description: Ask for help writing or certifying a Lathe source file.
title: "[authoring] <short description>"
labels: [help-wanted]
body:
  - type: markdown
    attributes:
      value: |
        Use this when your `.lth` compiles but certification or output does not
        match expectations. For language-server or CLI bugs, use the bug report
        template instead.

  - type: textarea
    id: lth-source
    attributes:
      label: Source .lth file
      description: Paste the full source you are authoring.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected certification / output
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual certification / output
    validations:
      required: true

  - type: input
    id: validator
    attributes:
      label: Which validator fired?
      description: e.g. `semantic_quality`, `visual_quality`, `flow_quality`, `surface_quality`, `silhouette`.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
