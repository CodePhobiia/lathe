name: Wonder Demo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wonder-demo:
    name: deterministic Wonder demo lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Lathe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Wonder demo lane
        run: python scripts/ci_wonder_demo.py

      - name: Upload Wonder demo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonder-demo-report
          path: |
            .tmp_tests/wonder_ci_demo/report.json
            .tmp_tests/wonder_ci_demo/before_after/reports/before_after_report.json
            .tmp_tests/wonder_ci_demo/before_after/comparisons/render_comparison.json
          if-no-files-found: ignore
