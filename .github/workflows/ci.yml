name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-test:
    name: fast test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run fast pytest partition
        run: >-
          python -m pytest -q
          tests/test_lathe.py
          tests/test_roundtrip.py
          tests/test_backends.py
          tests/test_doctor.py
          tests/test_gallery.py
          tests/test_remediation_metadata.py
          tests/test_language_v08.py
          tests/test_language_v09.py
          tests/test_language_v10.py
          tests/unit/test_net.py
          tests/unit/test_runtime_config.py
          tests/unit/test_sandbox_blender.py
          tests/unit/test_schema.py
          tests/unit/test_subproc.py
          tests/unit/test_subproc_failure_modes.py
          tests/unit/test_paths.py
          tests/unit/test_ref.py
          tests/unit/test_ref_phase2.py
          tests/unit/test_stage_collision.py
          tests/unit/test_telemetry.py
          tests/unit/test_validators_surface.py
          tests/unit/test_validators_visual.py
          tests/unit/test_utils.py
          tests/bugs
          -m "not requires_blender and not requires_xatlas and not requires_torch and not requires_network"

      - name: Environment doctor
        run: python -m lathe.cli doctor

      - name: Check example
        run: python -m lathe.cli check examples/courier_drone.lth

  contract-golden:
    name: contract + golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run contract and golden pytest partitions
        run: python -m pytest -q -m "contract or golden" tests/contract tests/golden

  property:
    name: property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run property pytest partition
        run: python -m pytest -q -m property tests/property

  devcontainer-config:
    name: devcontainer config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate devcontainer configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path(".devcontainer/devcontainer.json").read_text(encoding="utf-8"))
          if "build" in config:
              raise SystemExit("devcontainer must not point at the Blender Dockerfile unless that image is buildable")
          if "blender" in config.get("name", "").lower():
              raise SystemExit("devcontainer name must not claim Blender support")
          if config.get("containerEnv", {}).get("LATHE_BLENDER_PATH"):
              raise SystemExit("devcontainer must not set LATHE_BLENDER_PATH without installing Blender")
          expected_post_create = "bash scripts/bootstrap_local.sh --dev --export"
          if config.get("postCreateCommand") != expected_post_create:
              raise SystemExit(f"postCreateCommand must match README bootstrap: {expected_post_create}")
          PY

  clean-clone-readme:
    name: clean clone README setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv for dependency metadata check
        run: python -m pip install uv

      - name: Verify dependency lock and requirements exports
        run: python scripts/check_dependency_sync.py

      - name: Bootstrap exactly as documented in README
        run: bash scripts/bootstrap_local.sh --dev --export

      - name: Smoke exactly as documented in README
        run: bash scripts/lathe_smoke.sh
