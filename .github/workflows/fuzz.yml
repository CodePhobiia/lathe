name: Fuzz (nightly 10k)

# BL-42 — full 10k Hypothesis sweep of parser + normalizer fuzz tests.
# Default PR / local runs stay at 200 examples; this workflow sets
# LATHE_FUZZ_EXTENDED=1 so the same test files scale up for nightly
# coverage without slowing down the main CI loop.

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Hypothesis 10k
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Lathe (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run fuzz suite (10k examples)
        env:
          LATHE_FUZZ_EXTENDED: "1"
        run: |
          python -m pytest -q -m fuzz tests/fuzz/ -x

      - name: Upload Hypothesis corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-corpus
          path: .hypothesis/
          if-no-files-found: ignore
          retention-days: 30
