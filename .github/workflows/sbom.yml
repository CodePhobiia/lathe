name: SBOM

# SEC-4: CycloneDX SBOM generation.
#
# Emits sbom.json (CycloneDX 1.5 JSON) and sbom.xml for every push to
# main and every release tag. Artifacts are attached to the workflow run
# and — when triggered by a version tag — to the matching GitHub Release.
#
# Scope: the wheel's transitive dependency graph resolved from
# pyproject.toml (project + dev extras). This is the same graph pip-audit
# scans in the weekly audit workflow.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cyclonedx:
    name: cyclonedx-py (CycloneDX 1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Releases (tag pushes) need `contents: write` to upload assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + cyclonedx-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "cyclonedx-bom==4.5.0"

      - name: Generate SBOM (JSON)
        run: |
          mkdir -p dist
          cyclonedx-py environment \
            --output-format JSON \
            --schema-version 1.5 \
            --outfile dist/sbom.json

      - name: Generate SBOM (XML)
        run: |
          cyclonedx-py environment \
            --output-format XML \
            --schema-version 1.5 \
            --outfile dist/sbom.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lathe-sbom-${{ github.sha }}
          path: |
            dist/sbom.json
            dist/sbom.xml
          retention-days: 90

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/sbom.json \
            dist/sbom.xml \
            --clobber
