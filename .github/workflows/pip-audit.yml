name: pip-audit

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: pip-audit (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Run pip-audit
        id: audit
        run: |
          set +e
          pip-audit --strict --requirement requirements.txt || \
            pip-audit --strict . || exit_code=$?
          echo "exit_code=${exit_code:-0}" >> "$GITHUB_OUTPUT"
          exit ${exit_code:-0}

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "pip-audit: vulnerabilities detected ($(date -u +%Y-%m-%d))" \
            --label security,deps \
            --body "Weekly pip-audit run failed. See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
