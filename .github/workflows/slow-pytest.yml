name: Slow pytest

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: slow-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-pytest:
    name: slow marker lane
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run slow pytest lane
        run: python -m pytest -q -m slow
