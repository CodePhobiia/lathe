name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check changed Python files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run ruff-format --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            pre-commit run ruff-format --from-ref "${{ github.event.before }}" --to-ref "${{ github.sha }}"
          fi

  mypy:
    name: mypy typed surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: mypy typed surface
        run: >-
          mypy
          --follow-imports=silent
          lathe/errors.py
          lathe/assembly_ir.py
          lathe/feature_ir.py
          lathe/fit_ir.py
          lathe/kit_ir.py
          lathe/materials.py
          lathe/mesh_ir.py
          lathe/proposals.py
          lathe/ref.py
          lathe/reference_ir.py
          lathe/reuse_ir.py
          lathe/shape_ir.py
          lathe/solid_ir.py
          lathe/stages/budgets.py
          lathe/stages/lod.py
          lathe/surface_ir.py
          lathe/texture_control_pack.py
          lathe/transfer_ir.py
          lathe/validators/geometry_integrity.py
          lathe/validators/semantic_quality.py
          lathe/validators/surface_quality.py
