name: Benchmarks

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  benchmark-pytest:
    name: benchmark + visual quality tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Lathe (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run slow benchmark tests
        run: python -m pytest -q -m slow tests/test_benchmarks.py tests/test_visual_quality.py

      - name: Run hero performance manifest gate
        run: python scripts/profile_heroes.py --manifest --out-root tmp_perf_manifest
