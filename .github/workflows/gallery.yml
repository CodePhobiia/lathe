name: Gallery

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: gallery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render hero gallery
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Render gallery
        env:
          LATHE_BLENDER_PATH: /usr/bin/blender
        run: python scripts/render_gallery.py

      - name: Render scoreboard
        run: python scripts/render_scoreboard.py

      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: lathe-gallery
          path: |
            docs/gallery/
            docs/benchmarks/scoreboard.md
          if-no-files-found: warn
          retention-days: 14
