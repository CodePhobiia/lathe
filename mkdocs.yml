site_name: Lathe
site_description: Declarative language + reference compiler for 3D asset intent
site_url: https://talmerri.github.io/lathe/
repo_url: https://github.com/talmerri/lathe
repo_name: talmerri/lathe
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: true
  - mermaid2
  - gen-files:
      scripts:
        - docs/gen_stdlib_index.py
  - literate-nav
  - section-index

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorial:
      - tutorial/index.md
  - Language Reference:
      - v0.8: v08_language_reference.md
  - Cookbook:
      - cookbook/index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline: architecture/pipeline.md
      - Shape Stage: architecture/shape_stage.md
      - Backends: architecture/backends.md
  - API Reference:
      - CLI: api/cli.md
      - Parser: api/parser.md
      - Normalizer: api/normalizer.md
      - Resolver: api/resolver.md
      - Checker: api/checker.md
      - Planner: api/planner.md
      - Executor: api/executor.md
      - Backends: api/backends.md
      - Capabilities: api/capabilities.md
      - Doctor: api/doctor.md
      - Runtime config: api/runtime_config.md
      - Shape:
          - Backend: api/shape_backend.md
          - Providers: api/shape_providers.md
          - Shape IR: api/shape_ir.md
          - Asset graph: api/asset_graph.md
          - Assembly kernel: api/assembly_kernel.md
          - Scaffold compiler: api/scaffold_compiler.md
          - Feature grammar: api/feature_grammar.md
          - Feature fusion: api/feature_fusion.md
          - Mesh finalize: api/mesh_finalize.md
          - Conformance: api/conformance.md
      - IR modules:
          - Assembly IR: api/assembly_ir.md
          - Fit IR: api/fit_ir.md
          - Transfer IR: api/transfer_ir.md
          - Kit IR: api/kit_ir.md
          - Reuse IR: api/reuse_ir.md
          - Reference IR: api/reference_ir.md
      - Surface:
          - Materials: api/materials.md
          - PBR deriver: api/pbr_deriver.md
          - Texture control pack: api/texture_control_pack.md
          - Surface IR: api/surface_ir.md
      - Validators:
          - Semantic quality: api/validators/semantic_quality.md
          - Visual quality: api/validators/visual_quality.md
          - Flow quality: api/validators/flow_quality.md
          - Surface quality: api/validators/surface_quality.md
          - Silhouette: api/validators/silhouette.md
      - Bridge:
          - Blender plan: api/bridge/blender_plan.md
      - Stdlib: stdlib/index.md
  - Contributing:
      - Versioning: versioning.md
      - Dependency policy: dependency_policy.md
      - ADRs: adr/README.md
