<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lathe artifact viewer</title>
<!--
  Vendored <model-viewer> web component.
  Pinned major version: 3.x. Upstream project URL:
    https://modelviewer.dev/
  CDN URL (pinned):
    https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js
  To run fully offline, download that file to this directory as
  model-viewer.min.js and replace the <script src> below.
-->
<script type="module"
  src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e6e6;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 0.75rem 1.25rem; border-bottom: 1px solid #2a2f3a;
           display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: 0.04em; }
  header a { color: #80c0ff; text-decoration: none; font-size: 0.9rem; }
  main { height: calc(100vh - 3.2rem); display: grid; place-items: center; }
  model-viewer { width: 100%; height: 100%; background: #161a22; }
  .hint { position: fixed; bottom: 1rem; left: 1rem; color: #6b7280;
          font-size: 0.85rem; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Lathe artifact viewer</h1>
  <a href="/asset.glb" download>Download .glb</a>
</header>
<main>
  <model-viewer
    src="/asset.glb"
    alt="Lathe build artifact"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1.0">
  </model-viewer>
</main>
<p class="hint">Drag to orbit &middot; scroll to zoom &middot; double-click to recenter</p>
</body>
</html>
