# Pre-commit hooks for the lathe repo.
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: ^examples/refs/.*$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["--configfile", "bandit.yaml", "--severity-level", "medium", "--confidence-level", "medium"]
        # Bandit config exclusions already cover tests/examples; restrict
        # the hook to the lathe package so incidental scripts don't block
        # commits.
        files: ^lathe/.*\.py$
