# Pre-commit hooks for the lathe repo.
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
default_language_version:
  python: python

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: []
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: ^examples/refs/.*$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["--configfile", "bandit.yaml", "--severity-level", "medium", "--confidence-level", "medium"]
        # Bandit config exclusions already cover tests/examples; restrict
        # the hook to the lathe package so incidental scripts don't block
        # commits.
        files: ^lathe/.*\.py$

  - repo: local
    hooks:
      - id: mypy-typed-surface
        name: mypy typed surface
        entry: >-
          python -m mypy --follow-imports=silent
          lathe/errors.py
          lathe/assembly_ir.py
          lathe/feature_ir.py
          lathe/fit_ir.py
          lathe/kit_ir.py
          lathe/materials.py
          lathe/mesh_ir.py
          lathe/proposals.py
          lathe/ref.py
          lathe/reference_ir.py
          lathe/reuse_ir.py
          lathe/shape_ir.py
          lathe/solid_ir.py
          lathe/stages/budgets.py
          lathe/stages/lod.py
          lathe/surface_ir.py
          lathe/texture_control_pack.py
          lathe/transfer_ir.py
          lathe/validators/geometry_integrity.py
          lathe/validators/semantic_quality.py
          lathe/validators/surface_quality.py
        language: system
        pass_filenames: false
