[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lathe"
version = "0.2.0rc1"
description = "Reference compiler scaffold for the Lathe AI-native 3D build language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tal Merri", email = "talmerri@gmail.com" },
]
keywords = ["3d", "compiler", "dsl", "asset-pipeline", "game-dev", "procedural"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "lark>=1.1",
  "jsonschema>=4.0",
  "numpy>=2.4.6",
  "Pillow>=10.0",
  "trimesh>=4.12.2",
  "scipy>=1.16",
  "networkx>=3.2",
]

[project.urls]
Homepage = "https://github.com/talmerri/lathe"
Documentation = "https://talmerri.github.io/lathe/"
Repository = "https://github.com/talmerri/lathe"
Issues = "https://github.com/talmerri/lathe/issues"
Changelog = "https://github.com/talmerri/lathe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5",
  "ruff>=0.15.20",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-jsonschema",
  "types-Pillow",
  "hypothesis>=6.155.7",
  "syrupy>=5.3.4",
  "mutmut>=3.6.0",
  "pip-tools",
  "build",
  "pip-audit",
  "bump-my-version",
  "import-linter>=2.12",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-mermaid2-plugin",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
]
test-min = []
hunyuan_http = []
vggt = [
  "torch>=2.12.1",
  "torchvision>=0.27.1",
]
xatlas = [
  "xatlas>=0.0.11",
]
geometry = [
  "scikit-image>=0.25",
  "manifold3d>=3.5.2",
]
export = []  # scipy moved into core dependencies; alias kept for bootstrap scripts.
publish = [
  "cryptography>=43",
  "boto3>=1.43.36",
]

[project.scripts]
lathe = "lathe.cli:main"

# Plan 03 Phase 2: plugin entry-point registry. Built-in backends,
# stacks, providers, and validators are dogfooded through the same
# entry-point surface third-party plugins will use. See
# docs/extending.md for author-facing guidance.

[project.entry-points."lathe.backends"]
"lathe.topology.blender_hard_surface_v1" = "lathe.backends:hard_surface_topology_backend"
"lathe.topology.blender_subdiv_v1" = "lathe.backends:subdiv_topology_backend"
"lathe.uv.xatlas_v1" = "lathe.backends:xatlas_uv_backend"
"lathe.package.openusd_gltf_v1" = "lathe.backends:openusd_gltf_package_backend"
"lathe.shape.intent_mesh_handoff_v1" = "lathe.backends:intent_mesh_handoff_shape_backend"

[project.entry-points."lathe.stacks"]
"lathe.stack.hard_surface_game_asset_v1" = "lathe.backends:hard_surface_stack"
"lathe.stack.soft_surface_prop_v1" = "lathe.backends:soft_surface_stack"

[project.entry-points."lathe.providers.shape"]
"lathe.provider.shape.reference_conditioned_v1" = "lathe.providers.adapters.reference_conditioned:reference_conditioned_provider"
"lathe.provider.shape.hunyuan2_1_http_v1" = "lathe.providers.adapters.hunyuan:hunyuan_provider"
"lathe.provider.shape.vggt_local_v1" = "lathe.providers.adapters.vggt:vggt_provider"

[project.entry-points."lathe.geometry_kernels"]
"lathe.geometry.manifold_v1" = "lathe.geometry.manifold_kernel:manifold_kernel"
"lathe.geometry.reference_v1" = "lathe.geometry.reference_kernel:reference_kernel"

[project.entry-points."lathe.validators"]
"lathe.validator.semantic_quality" = "lathe.validators.semantic_quality:evaluate_semantic_quality"
"lathe.validator.visual_quality" = "lathe.validators.visual_quality:evaluate_visual_quality"
"lathe.validator.flow_quality" = "lathe.validators.flow_quality:evaluate_flow_quality"
"lathe.validator.surface_quality" = "lathe.validators.surface_quality:evaluate_surface_quality"
"lathe.validator.silhouette" = "lathe.validators.silhouette:compare_scaffold_signature"
"lathe.validator.geometry_integrity" = "lathe.validators.geometry_integrity:evaluate_geometry_integrity"

[tool.setuptools.packages.find]
where = ["."]
include = ["lathe*"]

# ---------------------------------------------------------------------------
# Tooling config (added Wave 1 per plans/01_code_quality.md, 02_documentation.md,
# 04_test_coverage.md, 05_developer_experience.md, 07_security.md).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["lathe"]
# Exclude transient build/dist output. These are not source — they are
# wheel/sdist build artifacts produced by `python -m build`.
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "C90", "N", "D", "PL", "TRY", "BLE", "PTH", "RUF", "S"]
ignore = [
  # Pydocstyle defaults that conflict with the Google convention.
  "D203",
  "D213",

  # Lathe's current codebase has a large legacy style baseline. Keep Ruff
  # enforcing import hygiene, syntax, most bug-prone constructs, and formatting
  # while the high-churn style and boundary-pattern families below are paid
  # down deliberately in smaller follow-up changes.
  "BLE001",
  "C901",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",  # undocumented-magic-method (matches D100-D104, D107 already ignored)
  "D107",
  "D205",
  "D301",
  "D417",  # undocumented-param (heuristic; google-style optional params noisy)
  "E402",
  "E501",
  "N801",
  "N802",
  "N803",
  "N806",
  "N812",
  "N814",
  "N818",
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLW1510",
  "PLW0108",
  "PLW0602",
  "PLW0603",
  "PLW2901",  # for-loop variable rebound — used pervasively across geometry/shape kernels for value normalisation (e.g. axial = float(axial)). Listed alongside the existing PLW0108/0602/0603 legacy-baseline ignores.
  "PTH100",
  "PTH102",
  "PTH112",
  "PTH118",
  "RUF005",
  "RUF012",
  "S311",  # non-crypto random — every procedural-generation site (scatter, vegetation branches/leaves, CGA, mesh_program) deliberately uses `random` for deterministic-with-seed asset generation. `secrets`-module is wrong for these call-sites.
  "S603",
  "SIM102",  # collapsible-if — used pervasively for readable guard chains. Listed alongside SIM103/108/112/117 legacy-baseline ignores.
  "SIM103",
  "SIM108",
  "SIM112",
  "SIM117",
  "TRY003",
  "TRY004",
  "TRY300",
  "TRY301",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "S"]
"grammar/*" = ["ALL"]
# Aggregator facade — F401 unused-import is the file's job (package-level re-exports
# from submodules such as `_capabilities`, `_common`, `_core`). External callers
# import via this module path; the underscored names are intentional package-private
# re-exports.
"lathe/geometry/kernel_program/__init__.py" = ["F401"]
# `import MaterialX as mx` is the official MaterialX-Python module convention; the
# downstream library expects the `mx` alias. Single file.
"lathe/surface_graph/materialx.py" = ["N813"]
# The 16×16 / 32×32 / N×N notation in geometry comments and docstrings uses the
# Unicode MULTIPLICATION SIGN (×) deliberately for readability of grid/dimension
# annotations. RUF002/RUF003 catch ambiguity between `×` and `x`, which is not a
# realistic ambiguity in this codebase's geometry context.
"lathe/shape_ir.py" = ["RUF002", "RUF003"]
"lathe/shape/procedural_program_path.py" = ["RUF002"]
"lathe/std/terrain/heightfield.py" = ["RUF002"]
"lathe/std/vegetation/imposter.py" = ["RUF002"]
"lathe/std/vegetation/lod.py" = ["RUF002"]
"lathe/validators/silhouette_multi_angle.py" = ["RUF002"]
# The `seed_token` argument names in feature_ops and instance_pattern are
# procedural-generation seed identifiers (used by deterministic scatter / poisson-disk
# sampling). S106 / S107 flag them only because the name contains "token". Each
# call-site passes a literal seed name (e.g. "socket_point"), not a credential.
"lathe/feature_ops/__init__.py" = ["S106"]
"lathe/instance_pattern.py" = ["S107"]

[tool.ruff.format]
# Supersedes black/isort; single source of truth.

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["trimesh.*", "lark.*", "xatlas.*", "torch.*", "torchvision.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["lathe"]
branch = true
omit = ["lathe/scaffolds/*", "lathe/__init__.py"]

[tool.coverage.report]
# Shared coverage ratchet. Keep this in sync with .coveragerc; CI must not
# override it with --cov-fail-under. BL-39 tracks the long-term 85% target.
fail_under = 65
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.lathe.coverage_gates]
# Coverage.py has one native fail_under gate. These Lathe-local package gates
# are enforced by tests/unit/test_coverage_policy.py against an explicit
# coverage XML report.
parser = { fail_under = 60, paths = ["lathe/parser"] }
resolver = { fail_under = 90, paths = ["lathe/resolver.py"] }
checker = { fail_under = 70, paths = ["lathe/checker"] }
planner = { fail_under = 90, paths = ["lathe/planner.py"] }
provider_config = { fail_under = 75, paths = ["lathe/runtime_config.py", "lathe/providers/registry.py", "lathe/providers/selection.py"] }
sandboxing = { fail_under = 55, paths = ["lathe/sandbox", "lathe/subproc.py"] }
cache = { fail_under = 70, paths = ["lathe/cache.py"] }
cli = { fail_under = 35, paths = ["lathe/cli"] }
telemetry = { fail_under = 80, paths = ["lathe/telemetry.py"] }
security = { fail_under = 75, paths = ["lathe/parser/prompt_injection.py", "lathe/net.py", "lathe/publish/signed_repro.py"] }
scene = { fail_under = 45, paths = ["lathe/scene"] }
wonder = { fail_under = 55, paths = ["lathe/wonder"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_blender: skipped unless Blender is available",
  "requires_xatlas: skipped unless xatlas is importable",
  "requires_torch: skipped unless torch is importable",
  "requires_network: skipped unless LATHE_TESTS_ALLOW_NETWORK=1",
  "bug_regression: regression test for an audit finding (tests/bugs/)",
  "contract: stable public contract tests",
  "golden: snapshot/golden tests",
  "property: Hypothesis/property tests",
  "fuzz: parser/normalizer fuzz tests",
  "slow: long-running tests kept out of the fast PR matrix",
]

[tool.uv]
# uv-specific settings live here; dependency groups below mirror optional-dependencies
# for uv's native workflow. Legacy pip users read [project.optional-dependencies].

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5",
  "ruff>=0.15.20",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-jsonschema",
  "types-Pillow",
  "hypothesis>=6.155.7",
  "syrupy>=5.3.4",
  "mutmut>=3.6.0",
  "pip-tools",
  "build",
  "pip-audit",
  "bump-my-version",
  "import-linter>=2.12",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-mermaid2-plugin",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
]
