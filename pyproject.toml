[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lathe"
version = "0.1.0"
description = "Reference compiler scaffold for the Lathe AI-native 3D build language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tal Merri", email = "talmerri@gmail.com" },
]
keywords = ["3d", "compiler", "dsl", "asset-pipeline", "game-dev", "procedural"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "lark>=1.1",
  "jsonschema>=4.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "trimesh>=4.0",
]

[project.urls]
Homepage = "https://github.com/talmerri/lathe"
Documentation = "https://talmerri.github.io/lathe/"
Repository = "https://github.com/talmerri/lathe"
Issues = "https://github.com/talmerri/lathe/issues"
Changelog = "https://github.com/talmerri/lathe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-jsonschema",
  "types-Pillow",
  "hypothesis>=6.100",
  "syrupy>=4",
  "mutmut>=2.5",
  "pip-tools",
  "build",
  "pip-audit",
  "bump-my-version",
  "import-linter>=2.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-mermaid2-plugin",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
]
test-min = []
hunyuan_http = []
vggt = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
xatlas = [
  "xatlas>=0.0.11",
]
geometry = [
  "scikit-image>=0.25",
  "manifold3d>=2.5",
]
export = [
  "scipy>=1.16",
]
publish = [
  "cryptography>=43",
  "boto3>=1.34",
]

[project.scripts]
lathe = "lathe.cli:main"

# Plan 03 Phase 2: plugin entry-point registry. Built-in backends,
# stacks, providers, and validators are dogfooded through the same
# entry-point surface third-party plugins will use. See
# docs/extending.md for author-facing guidance.

[project.entry-points."lathe.backends"]
"lathe.topology.blender_hard_surface_v1" = "lathe.backends:hard_surface_topology_backend"
"lathe.topology.blender_subdiv_v1" = "lathe.backends:subdiv_topology_backend"
"lathe.uv.xatlas_v1" = "lathe.backends:xatlas_uv_backend"
"lathe.package.openusd_gltf_v1" = "lathe.backends:openusd_gltf_package_backend"
"lathe.shape.intent_mesh_handoff_v1" = "lathe.backends:intent_mesh_handoff_shape_backend"

[project.entry-points."lathe.stacks"]
"lathe.stack.hard_surface_game_asset_v1" = "lathe.backends:hard_surface_stack"
"lathe.stack.soft_surface_prop_v1" = "lathe.backends:soft_surface_stack"

[project.entry-points."lathe.providers.shape"]
"lathe.provider.shape.reference_conditioned_v1" = "lathe.providers.adapters.reference_conditioned:reference_conditioned_provider"
"lathe.provider.shape.hunyuan2_1_http_v1" = "lathe.providers.adapters.hunyuan:hunyuan_provider"
"lathe.provider.shape.vggt_local_v1" = "lathe.providers.adapters.vggt:vggt_provider"

[project.entry-points."lathe.geometry_kernels"]
"lathe.geometry.manifold_v1" = "lathe.geometry.manifold_kernel:manifold_kernel"
"lathe.geometry.reference_v1" = "lathe.geometry.reference_kernel:reference_kernel"

[project.entry-points."lathe.validators"]
"lathe.validator.semantic_quality" = "lathe.validators.semantic_quality:evaluate_semantic_quality"
"lathe.validator.visual_quality" = "lathe.validators.visual_quality:evaluate_visual_quality"
"lathe.validator.flow_quality" = "lathe.validators.flow_quality:evaluate_flow_quality"
"lathe.validator.surface_quality" = "lathe.validators.surface_quality:evaluate_surface_quality"
"lathe.validator.silhouette" = "lathe.validators.silhouette:compare_scaffold_signature"

[tool.setuptools.packages.find]
where = ["."]
include = ["lathe*"]

# ---------------------------------------------------------------------------
# Tooling config (added Wave 1 per plans/01_code_quality.md, 02_documentation.md,
# 04_test_coverage.md, 05_developer_experience.md, 07_security.md).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["lathe"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "C90", "N", "D", "PL", "TRY", "BLE", "PTH", "RUF", "S"]
ignore = ["D203", "D213", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "S"]
"grammar/*" = ["ALL"]

[tool.ruff.format]
# Supersedes black/isort; single source of truth.

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["trimesh.*", "lark.*", "xatlas.*", "torch.*", "torchvision.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["lathe"]
branch = true
omit = ["lathe/scaffolds/*", "lathe/__init__.py"]

[tool.coverage.report]
# Ratchet gate at 65 (current measured: 69.66%); 85 target tracked as BL-39.
fail_under = 65
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_blender: skipped unless Blender is available",
  "requires_xatlas: skipped unless xatlas is importable",
  "requires_torch: skipped unless torch is importable",
  "requires_network: skipped unless LATHE_TESTS_ALLOW_NETWORK=1",
  "bug_regression: regression test for an audit finding (tests/bugs/)",
]

[tool.uv]
# uv-specific settings live here; dependency groups below mirror optional-dependencies
# for uv's native workflow. Legacy pip users read [project.optional-dependencies].

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-jsonschema",
  "types-Pillow",
  "hypothesis>=6.100",
  "syrupy>=4",
  "mutmut>=2.5",
  "pip-tools",
  "build",
  "pip-audit",
  "bump-my-version",
  "import-linter>=2.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-mermaid2-plugin",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
]
